<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select task</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f1a;
            --surface: #131629;
            --card: #1a1e35;
            --border: #2a2f50;
            --accent: #e8c84a;
            --muted: #6b7280;
            --text: #e2e8f0;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* ── Animated background grid ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(232, 200, 74, .03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(232, 200, 74, .03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .page-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            padding: 24px 16px;
            text-align: center;
        }

        h1.title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(1.6rem, 5vw, 2.5rem);
            font-weight: 900;
            letter-spacing: .15em;
            color: var(--accent);
            text-shadow: 0 0 24px rgba(232, 200, 74, .5), 0 0 60px rgba(232, 200, 74, .2);
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        h1.title span {
            opacity: .5;
            font-size: .35em;
            letter-spacing: .3em;
            color: var(--text);
            text-shadow: none;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 500px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        /* ── Cards ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: .6;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(232, 200, 74, 0.4);
        }

        .card-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.4rem;
            letter-spacing: .15em;
            color: var(--text);
            text-transform: uppercase;
            margin-bottom: 24px;
            font-weight: 700;
        }

        /* ── Buttons ── */
        .btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 7px;
            font-family: 'Orbitron', monospace;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: .1em;
            cursor: pointer;
            transition: all .2s;
            text-transform: uppercase;
            background: var(--accent);
            color: #0d0f1a;
            text-align: center;
        }

        .card:hover .btn {
            background: #f5d96a;
            box-shadow: 0 0 20px rgba(232, 200, 74, .4);
        }
    </style>
</head>

<body>
    <div class="page-wrap">
        <h1 class="title">
            Idk OOP lab probably but I'm not sure
            <span>// Select Module //</span>
        </h1>

        <div class="layout">
            <!-- Task 1 -->
            <a href="task1/index.html" class="card">
                <div class="card-title">Task 1</div>
                <div class="btn">Open</div>
            </a>

            <!-- Task 2 -->
            <a href="task2/index.html" class="card">
                <div class="card-title">Task 2</div>
                <div class="btn">Open</div>
            </a>
        </div>
    </div>
</body>

</html>
