<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Voronoi Diagram Generator</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #242424;
            color: white;
        }

        canvas {
            border: 1px solid #fff;
            cursor: crosshair;
            background: #000;
            margin-top: 10px;
        }

        .controls {
            padding: 10px;
            background: #333;
            border-radius: 8px;
            margin-top: 10px;
        }

        button,
        select {
            padding: 5px 10px;
            margin: 0 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Voronoi Brute-Force</h2>
    <div class="controls">
        <button onclick="clearPoints()">Clear</button>
        <button onclick="randomPoints(10)">Add 10 Random</button>
        <select id="metric" onchange="render()">
            <option value="euclidean">Euclidean</option>
            <option value="manhattan">Manhattan</option>
        </select>
        <select id="mode" onchange="render()">
            <option value="single">Single Thread</option>
            <option value="multi">Multi Thread (Workers)</option>
        </select>
        <span id="stats" style="margin-left: 20px; color: #a6e3a1;">Time: 0 ms</span>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let points = [];

        // Dynamic Web Worker Code (Blob URL Trick)
        const workerCode = `
            self.onmessage = function(e) {
                const { imageData, pts, startY, endY, width, metric } = e.data;
                const data = imageData.data;
                for (let y = startY; y < endY; y++) {
                    for (let x = 0; x < width; x++) {
                        let minDist = Infinity;
                        let color = [0,0,0];
                        for (let i = 0; i < pts.length; i++) {
                            let d = metric === 'manhattan' 
                                ? Math.abs(x - pts[i].x) + Math.abs(y - pts[i].y)
                                : Math.sqrt((x - pts[i].x)**2 + (y - pts[i].y)**2);
                            if (d < minDist) {
                                minDist = d;
                                color = pts[i].color;
                            }
                        }
                        const idx = (y * width + x) * 4;
                        data[idx] = color[0];
                        data[idx+1] = color[1];
                        data[idx+2] = color[2];
                        data[idx+3] = 255;
                    }
                }
                postMessage({ imageData, startY, endY });
            };
        `;
        const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(workerBlob);

        function getRandomColor() {
            return [Math.floor(Math.random() * 255), Math.floor(Math.random() * 255), Math.floor(Math.random() * 255)];
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            points.push({ x: Math.floor(e.clientX - rect.left), y: Math.floor(e.clientY - rect.top), color: getRandomColor() });
            render();
        });

        function clearPoints() { points = []; ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function randomPoints(n) {
            for (let i = 0; i < n; i++) {
                points.push({ x: Math.floor(Math.random() * canvas.width), y: Math.floor(Math.random() * canvas.height), color: getRandomColor() });
            }
            render();
        }

        async function render() {
            if (points.length === 0) return;
            const mode = document.getElementById('mode').value;
            const metric = document.getElementById('metric').value;
            const start = performance.now();

            if (mode === 'single') {
                const imgData = ctx.createImageData(canvas.width, canvas.height);
                const data = imgData.data;
                for (let y = 0; y < canvas.height; y++) {
                    for (let x = 0; x < canvas.width; x++) {
                        let minDist = Infinity;
                        let color = [0, 0, 0];
                        for (let i = 0; i < points.length; i++) {
                            let d = metric === 'manhattan' ? Math.abs(x - points[i].x) + Math.abs(y - points[i].y) : Math.sqrt((x - points[i].x) ** 2 + (y - points[i].y) ** 2);
                            if (d < minDist) { minDist = d; color = points[i].color; }
                        }
                        const idx = (y * canvas.width + x) * 4;
                        data[idx] = color[0]; data[idx + 1] = color[1]; data[idx + 2] = color[2]; data[idx + 3] = 255;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                drawPoints();
                document.getElementById('stats').innerText = `Time: ${(performance.now() - start).toFixed(2)} ms (Single Thread)`;
            } else {
                const numWorkers = navigator.hardwareConcurrency || 4;
                const chunkHeight = Math.ceil(canvas.height / numWorkers);
                let workersFinished = 0;

                for (let i = 0; i < numWorkers; i++) {
                    const worker = new Worker(workerUrl);
                    const startY = i * chunkHeight;
                    const endY = Math.min(startY + chunkHeight, canvas.height);
                    const imgData = ctx.createImageData(canvas.width, endY - startY);

                    worker.postMessage({ imageData: imgData, pts: points, startY: 0, endY: endY - startY, width: canvas.width, metric });

                    worker.onmessage = function (e) {
                        ctx.putImageData(e.data.imageData, 0, startY);
                        worker.terminate();
                        workersFinished++;
                        if (workersFinished === numWorkers) {
                            drawPoints();
                            document.getElementById('stats').innerText = `Time: ${(performance.now() - start).toFixed(2)} ms (Multi Thread: ${numWorkers} Workers)`;
                        }
                    };
                }
            }
        }

        function drawPoints() {
            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.stroke();
            });
        }
    </script>
</body>

</html>
